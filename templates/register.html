{% extends "base.html" %}
{% block title %}Register · Document Tracker{% endblock %}
{% block content %}
<div class="form-card"><h1>Create account</h1>
<form method="post">
  <label>Username<input name="username" minlength="3" required autocomplete="username"></label>
  <label>Password<input type="password" name="password" minlength="6" required autocomplete="new-password"></label>
  <button class="btn" type="submit">Register</button>
</form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>
{% endblock %}
